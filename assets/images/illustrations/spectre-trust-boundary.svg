<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">Two independent gates before active verification</title>
  <desc id="gate-desc">The documented capability requires explicit installation enablement and a separate authorization grant for the exact target. Discovery alone grants no permission. Bounded verification yields new evidence; it does not overwrite original observations. This is an explanatory diagram, not an execution trace.</desc>
  <g fill="none" stroke="#55418A" stroke-width="1" opacity=".35"><path d="M24 35H776M24 285H776M24 35V285M776 35V285"/><path d="M24 160H776" stroke-dasharray="2 10"/></g>
  <g fill="none" stroke="#9CDCE6" stroke-width="1.3"><path d="M254 160H290M512 160H548"/><path d="M279 155L284 160L279 165M537 155L542 160L537 165"/><path d="M144 223V252H658V223" stroke-dasharray="4 6" opacity=".45"/></g>
  <g fill="#110E19" stroke="#786695" stroke-width="1.2"><rect x="34" y="99" width="220" height="124" rx="8"/><rect x="290" y="99" width="222" height="124" rx="8"/><rect x="548" y="99" width="218" height="124" rx="8"/></g>
  <g font-family="monospace" fill="#F0EBFF" font-size="15"><text x="51" y="132">01 / Enable capability</text><text x="307" y="132">02 / Exact-target grant</text><text x="565" y="132">03 / Bounded checks</text></g>
  <g font-family="monospace" fill="#B6AEC9" font-size="13"><text x="51" y="166">Installation-level gate</text><text x="51" y="191">Disabled by default</text><text x="307" y="166">Separate authorization</text><text x="307" y="191">No inherited permission</text><text x="565" y="166">Non-destructive methods</text><text x="565" y="191">Results add evidence</text><text x="34" y="64" fill="#9CDCE6">PASSIVE-FIRST / DOCUMENTED AUTHORIZATION MODEL</text></g>
</svg>
