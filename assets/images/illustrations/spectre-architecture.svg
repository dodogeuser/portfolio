<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="spectre-map-title spectre-map-desc">
  <title id="spectre-map-title">SPECTRE documented component responsibilities</title>
  <desc id="spectre-map-desc">The browser interface relates to FastAPI case services and MySQL persistence through SQLAlchemy and Alembic. Collectors supply provenance-bearing evidence, which supports graph, timeline, findings and reports. Dashed relationships identify authorization and audit boundaries. This map is a documentation-derived explanation, not a verified runtime call sequence.</desc>
