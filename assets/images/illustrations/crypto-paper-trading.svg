  <title id="crypto-art-title">Crypto Scalping Bot — paper-trading research</title>
  <desc id="crypto-art-desc">An illustrative pipeline from abstract market candles through a strategy signal and simulated execution to a paper-trade ledger. Violet and muted mint traces describe strategy research, not a verified system topology. Candles are decorative samples, not measured market data, real-money orders or evidence of profitability.</desc>
